name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Verify build output
              run: |
                  test -f docs/index.html || { echo "::error::docs/index.html missing"; exit 1; }
                  test -f docs/CNAME || { echo "::error::docs/CNAME missing - custom domain will break"; exit 1; }
                  test -f docs/.nojekyll || { echo "::error::docs/.nojekyll missing - Jekyll will strip _app assets"; exit 1; }

            - uses: actions/configure-pages@v5
              id: pages

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: docs

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
